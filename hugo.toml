# Theme config. Micro.blog's own config.json wins over everything here.

[module.hugoVersion]
  min = "0.158.0"
  extended = true

# Feeds and other outputs are Micro.blog's: its config.json lists them, and
# the theme supplies templates for its RSS and JSON formats.

# No [params]: Micro.blog writes a site's settings from plugin.json, and
# _partials/settings.html applies the defaults, because an unticked box or a
# blank field there would beat anything set here.
