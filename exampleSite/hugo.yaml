# Run from the theme root:  hugo server -s exampleSite --themesDir ../..
baseURL: https://example.org/
locale: en-us
timeZone: America/Los_Angeles
title: Clodd Example
theme: hugo-theme-clodd

pagination:
  pagerSize: 10

permalinks:
  page:
    posts: /:year/:month/:day/:contentbasename/

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: An example site for the Clodd Hugo theme.
  author:
    name: Sam Example
    bio: I write about the open web, photography and the occasional bike ride.
    avatar: images/avatar.png
    email: sam@example.org
  social:
    mastodon: "@sam@mastodon.example"
    bluesky: https://bsky.app/profile/sam.example.org
    github: https://github.com/example
  indieauth:
    indiekey: example-site-id
  micropub: https://micropub.example.org/
  webmentions:
    domain: example.org

menus:
  main:
    - name: Archive
      pageRef: /archive
      url: /archive/
      weight: 10
    - name: Photos
      pageRef: /photos
      url: /photos/
      weight: 20
    - name: About
      pageRef: /about
      weight: 30
    - name: Now
      pageRef: /now
      parent: About
      weight: 31
    - name: Colophon
      pageRef: /colophon
      parent: About
      weight: 32

# Uploads live in static/media; mounting them into assets too lets the
# theme read their dimensions and make thumbnails. Declaring an assets mount
# replaces the default, so assets/ is listed again.
module:
  mounts:
    - source: assets
      target: assets
    - source: static/media
      target: assets/media
