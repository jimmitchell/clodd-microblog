{{ define "main" }}
{{- /* Phase 1 placeholder list. Phase 3 replaces it with the h-card intro
       and the h-feed of cards. */}}
<div class="post__content prose">
<ul>
  {{- range (partial "pager.html" .).Pages }}

  {{- end }}
</ul>
</div>
{{ end }}
